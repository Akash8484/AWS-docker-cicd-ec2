name: Deploy Docker App to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/AWS-docker-cicd-ec2
            git pull origin main
            sudo docker build -t aws-devops-demo:latest .
            sudo docker rm -f aws-devops-web || true
            sudo docker run -d --name aws-devops-web -p 80:80 --restart unless-stopped aws-devops-demo:latest
